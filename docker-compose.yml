version: "3.9"

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.6.0
    container_name: mlflow-server
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --allowed-hosts '*'

volumes:
  mlflow_data:





